# Social Autopilot with the Hermes runtime.
#
#   cp .env.example .env    # OPENAI_API_KEY, HERMES_API_KEY, TOOL_TOKEN, SOCIAL_API_KEY,
#                           # (see README)
#   docker compose up --build
#   open http://localhost:3000
#
# The app calls Hermes server-side on the internal network; Hermes calls the
# app's tools at http://app:3000/api/mcp. Neither Hermes nor the MCP endpoint
# is published on the host.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      RUNTIME: hermes
      HERMES_URL: http://hermes:8642
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/app/data
    # Up means answering: with APP_PASSWORD set the answer is a 401.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/capabilities').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  hermes:
    # Pinned by tag and digest (Hermes Agent v0.22.5, 2026-10-23).
    image: nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    command: ["gateway", "run"]
    # Hermes connects to the app's MCP tools when it starts, so the app goes first.
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      TOOL_TOKEN: ${TOOL_TOKEN:?set TOOL_TOKEN in .env}
      # config.yaml below is mounted read-only; do not let Hermes rewrite it.
      HERMES_SKIP_CONFIG_MIGRATION: "1"
    volumes:
      - hermes-data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
    expose:
      - "8642"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped

volumes:
  app-data:
  hermes-data:
