# Social Autopilot CI. This repository is exported from Creative Tim's monorepo
# (see CONTRIBUTING.md); the same checks run there before every export.
#
#   check        install (frozen), typecheck, tests, production build
#   compose      build the image and start app + Hermes; Hermes must reach the
#                app's MCP tools. No model is called.
#   secret-scan  gitleaks over the full history

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --include-workspace-root typecheck
      - run: pnpm -r --include-workspace-root test
      - run: pnpm build

  compose:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Environment with throwaway keys
        run: |
          {
            echo "OPENAI_API_KEY=ci-not-a-real-key"
            echo "HERMES_API_KEY=$(openssl rand -hex 32)"
            echo "TOOL_TOKEN=$(openssl rand -hex 32)"
          } > .env
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Hermes reaches the app's MCP tools
        run: |
          docker compose exec -T hermes python3 -c '
          import json, os, urllib.request
          req = urllib.request.Request(
              "http://app:3000/api/mcp",
              data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list"}).encode(),
              headers={"Authorization": "Bearer " + os.environ["TOOL_TOKEN"], "Content-Type": "application/json"},
          )
          names = [t["name"] for t in json.load(urllib.request.urlopen(req, timeout=15))["result"]["tools"]]
          print("app MCP tools:", ", ".join(names))
          if not names:
              raise SystemExit("the app offers no MCP tools")
          '
          docker compose exec -T hermes hermes mcp test app
      - if: always()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, compose, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/creativetimofficial/open-social
        run: |
          image=ghcr.io/creativetimofficial/open-social
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"
